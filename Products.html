<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Era Solar | Premium Solar Solutions</title>
    <meta name="description" content="Browse Era Solar's premium collection of solar panels, inverters, batteries, and complete solar solutions.">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="https://i.ibb.co/Xr2NHYPY/Gemini-Generated-Image-xeafzlxeafzlxeaf.jpg">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        :root {
            --primary: #FF9800;
            --secondary: #2196F3;
            --dark: #1A237E;
            --dark-blue: #0D1B3E;
            --light: #F5F5F5;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --gradient: linear-gradient(135deg, #FF9800 0%, #FF5722 100%);
            --gradient-blue: linear-gradient(135deg, #1A237E 0%, #2196F3 100%);
        }

        body {
            background-color: #ffffff;
            color: #333;
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Compact Header */
        .compact-header {
            background: #ffffff;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 12px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-container img {
            height: 40px;
            transition: transform 0.3s ease;
        }

        .logo-container:hover img {
            transform: scale(1.05);
        }

        .logo-slogan {
            font-size: 12px;
            color: #666;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Main Container */
        .main-container {
            padding: 20px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Search and Filter Section */
        .controls-section {
            margin-bottom: 30px;
        }

        .search-container {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box {
            width: 100%;
            padding: 14px 50px 14px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95rem;
            background: white;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }

        .search-box:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 152, 0, 0.15);
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 1rem;
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .filter-btn {
            background: white;
            border: 2px solid #e2e8f0;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a5568;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .filter-btn.active {
            background: var(--gradient);
            color: white;
            border-color: transparent;
        }

        .price-filter-btn {
            background: white;
            border: 2px solid #e2e8f0;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a5568;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s ease;
        }

        .price-filter-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Price Filter Panel */
        .price-filter-panel {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            box-shadow: var(--shadow);
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .price-filter-panel.active {
            display: block;
        }

        .price-inputs {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .price-inputs input {
            padding: 8px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            width: 120px;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .price-inputs input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .price-buttons {
            display: flex;
            gap: 10px;
        }

        .price-buttons button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .apply-btn {
            background: var(--gradient);
            color: white;
        }

        .apply-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 152, 0, 0.3);
        }

        .clear-btn {
            background: #f8f9fa;
            color: #4a5568;
            border: 2px solid #e2e8f0;
        }

        .clear-btn:hover {
            background: #e9ecef;
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        /* Product Card */
        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            border: 1px solid #f0f0f0;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            border-color: var(--primary);
        }

        .product-carousel {
            position: relative;
            width: 100%;
            overflow: hidden;
            height: 200px;
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-carousel img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .product-carousel img.active {
            opacity: 1;
        }

        .carousel-dots {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 5px;
            z-index: 2;
        }

        .carousel-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .carousel-dot.active {
            background: var(--primary);
            transform: scale(1.2);
        }

        .product-info {
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .product-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--dark);
            line-height: 1.4;
        }

        .product-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .product-price::before {
            content: '₹';
            font-size: 0.9rem;
            margin-right: 2px;
        }

        .product-description {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 12px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-brands {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .brand-logo {
            width: 24px;
            height: 24px;
            object-fit: contain;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            padding: 1px;
            background: white;
            transition: all 0.3s ease;
        }

        .brand-logo:hover {
            transform: scale(1.1);
            border-color: var(--primary);
        }

        .product-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 15px;
            font-size: 0.7rem;
            font-weight: 600;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .category-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--gradient);
            color: white;
            padding: 4px 8px;
            border-radius: 15px;
            font-size: 0.7rem;
            font-weight: 600;
            z-index: 2;
        }

        .product-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: auto;
        }

        .view-details-btn {
            background: var(--dark-blue);
            color: white;
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            border: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .view-details-btn:hover {
            background: #152452;
            transform: translateY(-2px);
        }

        .whatsapp-btn {
            background: var(--gradient);
            color: white;
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            border: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .whatsapp-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 152, 0, 0.3);
        }

        .whatsapp-btn i {
            font-size: 0.95rem;
        }

        /* Loading State */
        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
            grid-column: 1 / -1;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
            grid-column: 1 / -1;
        }

        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: var(--primary);
            opacity: 0.5;
        }

        /* Results Count */
        .results-count {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 15px;
            padding: 0 5px;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 20px;
            }
        }

        @media (max-width: 768px) {
            .compact-header {
                padding: 10px 15px;
            }
            
            .logo-container img {
                height: 35px;
            }
            
            .logo-slogan {
                font-size: 11px;
            }
            
            .main-container {
                padding: 15px;
            }
            
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 15px;
            }
            
            .product-carousel {
                height: 180px;
            }
        }

        @media (max-width: 640px) {
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
            
            .filter-row {
                justify-content: center;
            }
            
            .price-inputs {
                flex-direction: column;
                align-items: stretch;
            }
            
            .price-inputs input {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .products-grid {
                grid-template-columns: 1fr;
                max-width: 350px;
                margin: 0 auto;
            }
            
            .product-carousel {
                height: 200px;
            }
            
            .logo-slogan {
                display: none;
            }
            
            .filter-btn, .price-filter-btn {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
        }

        /* Product count per row adjustment */
        @media (min-width: 1200px) {
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                gap: 30px;
            }
            
            .product-carousel {
                height: 220px;
            }
        }

        /* Footer */
        .footer {
            background: var(--dark-blue);
            color: white;
            padding: 40px 5% 20px;
            margin-top: 50px;
        }

        .footer-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .footer-column h4 {
            font-size: 1rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .footer-column p, .footer-column a {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 10px;
            display: block;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .footer-column a:hover {
            color: white;
            transform: translateX(3px);
        }

        .social-icons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .social-icons a {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .social-icons a:hover {
            background: var(--primary);
            transform: translateY(-2px);
        }

        .copyright {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
        }

        /* WhatsApp Button */
        .whatsapp-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            background: #25D366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            z-index: 999;
            transition: all 0.2s ease;
            text-decoration: none;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .whatsapp-button:hover {
            transform: scale(1.1);
            background: #1da851;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
            animation: none;
        }
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Supabase client
        const sb = supabase.createClient(
            "https://mnkewhamntefyutzrnaw.supabase.co",
            "sb_publishable_8wi_FUAoAhhnHRNsJg3u8w_bbPLiGHd"
        );

        let allProducts = [];
        let filteredProducts = [];
        let carouselIntervals = new Map();
        let isPriceFilterOpen = false;

        // Load all products
        async function loadProducts() {
            try {
                document.getElementById('loadingState').style.display = 'block';
                document.getElementById('resultsCount').textContent = '';
                
                // Load companies first
                const { data: companies, error: companiesError } = await sb
                    .from('companies')
                    .select('*');
                    
                if (companiesError) throw companiesError;
                const allCompanies = companies || [];
                
                // Load products with their companies
                const { data: products, error: productsError } = await sb
                    .from('products')
                    .select(`
                        *,
                        product_companies (
                            company_id,
                            companies (
                                id,
                                company_name,
                                logo_image_id
                            )
                        )
                    `)
                    .order('created_at', { ascending: false });
                    
                if (productsError) throw productsError;
                
                // Process products data
                allProducts = (products || []).map(product => {
                    // Get associated companies
                    const companies = (product.product_companies || [])
                        .map(pc => pc.companies)
                        .filter(Boolean);
                    
                    return {
                        ...product,
                        companies: companies,
                        // Ensure images_id is an array
                        images_id: Array.isArray(product.images_id) ? product.images_id : []
                    };
                });
                
                filteredProducts = [...allProducts];
                renderProducts(filteredProducts);
                renderFilters();
                document.getElementById('loadingState').style.display = 'none';
                
            } catch (error) {
                console.error('Error loading products:', error);
                document.getElementById('loadingState').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Error Loading Products</h3>
                        <p>Please check your connection and try again.</p>
                    </div>
                `;
            }
        }

        // Render products
        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');
            
            // Clear existing carousel intervals
            carouselIntervals.forEach(interval => clearInterval(interval));
            carouselIntervals.clear();
            
            // Update results count
            document.getElementById('resultsCount').textContent = 
                `Showing ${products.length} product${products.length !== 1 ? 's' : ''}`;
            
            if (products.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <h3>No Products Found</h3>
                        <p>Try adjusting your search or filter criteria</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = '';
            
            products.forEach((product, index) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.style.animationDelay = `${index * 0.05}s`;
                
                // Product code badge
                if (product.product_code) {
                    const codeBadge = document.createElement('div');
                    codeBadge.className = 'product-badge';
                    codeBadge.innerHTML = `<i class="fas fa-tag"></i> ${product.product_code}`;
                    card.appendChild(codeBadge);
                }
                
                // Category badge (if available)
                if (product.category) {
                    const categoryBadge = document.createElement('div');
                    categoryBadge.className = 'category-badge';
                    categoryBadge.textContent = product.category;
                    card.appendChild(categoryBadge);
                }
                
                // Carousel
                const carousel = document.createElement('div');
                carousel.className = 'product-carousel';
                
                const images = product.images_id || [];
                
                if (images.length > 0) {
                    images.forEach((imageUrl, imgIndex) => {
                        const img = document.createElement('img');
                        img.src = imageUrl;
                        img.alt = product.title;
                        img.loading = 'lazy';
                        img.className = imgIndex === 0 ? 'active' : '';
                        img.onerror = () => {
                            // Show placeholder for broken images
                            img.src = 'https://via.placeholder.com/300x200/FF9800/ffffff?text=Solar+Product';
                        };
                        carousel.appendChild(img);
                    });
                    
                    // Add navigation dots if multiple images
                    if (images.length > 1) {
                        const dotsContainer = document.createElement('div');
                        dotsContainer.className = 'carousel-dots';
                        
                        images.forEach((_, dotIndex) => {
                            const dot = document.createElement('div');
                            dot.className = `carousel-dot ${dotIndex === 0 ? 'active' : ''}`;
                            dot.onclick = (e) => {
                                e.stopPropagation();
                                showImage(carousel, dotIndex);
                            };
                            dotsContainer.appendChild(dot);
                        });
                        
                        carousel.appendChild(dotsContainer);
                        
                        // Auto-rotate carousel
                        let currentIndex = 0;
                        const interval = setInterval(() => {
                            currentIndex = (currentIndex + 1) % images.length;
                            showImage(carousel, currentIndex);
                        }, 4000);
                        
                        carouselIntervals.set(card, interval);
                    }
                } else {
                    // No image placeholder
                    const placeholder = document.createElement('div');
                    placeholder.style.cssText = `
                        width: 100%;
                        height: 100%;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
                        color: var(--primary);
                        font-size: 40px;
                    `;
                    placeholder.innerHTML = '<i class="fas fa-solar-panel"></i>';
                    carousel.appendChild(placeholder);
                }
                
                card.appendChild(carousel);
                
                // Product Info
                const info = document.createElement('div');
                info.className = 'product-info';
                
                info.innerHTML = `
                    <div class="product-title">${product.title}</div>
                    ${product.price && product.price !== 'NA' ? `<div class="product-price">${product.price}</div>` : ''}
                    ${product.description ? `<div class="product-description">${product.description}</div>` : ''}
                `;
                
                // Company logos
                if (product.companies && product.companies.length > 0) {
                    const brandsContainer = document.createElement('div');
                    brandsContainer.className = 'product-brands';
                    
                    product.companies.forEach(company => {
                        if (company.logo_image_id) {
                            const img = document.createElement('img');
                            img.src = company.logo_image_id;
                            img.alt = company.company_name;
                            img.title = company.company_name;
                            img.className = 'brand-logo';
                            img.onerror = () => {
                                img.style.display = 'none';
                            };
                            brandsContainer.appendChild(img);
                        }
                    });
                    
                    if (brandsContainer.children.length > 0) {
                        info.appendChild(brandsContainer);
                    }
                }
                
                card.appendChild(info);
                
                // Button Container
                const actionsContainer = document.createElement('div');
                actionsContainer.className = 'product-actions';
                
                // View Details Button
                const viewDetailsBtn = document.createElement('button');
                viewDetailsBtn.className = 'view-details-btn';
                viewDetailsBtn.innerHTML = '<i class="fas fa-eye"></i> Details';
                viewDetailsBtn.onclick = (e) => {
                    e.stopPropagation();
                    viewProductDetails(product.id);
                };
                
                // WhatsApp Button
                const whatsappBtn = document.createElement('button');
                whatsappBtn.className = 'whatsapp-btn';
                whatsappBtn.innerHTML = '<i class="fab fa-whatsapp"></i> WhatsApp';
                whatsappBtn.onclick = (e) => {
                    e.stopPropagation();
                    redirectWA(product);
                };
                
                actionsContainer.appendChild(viewDetailsBtn);
                actionsContainer.appendChild(whatsappBtn);
                card.appendChild(actionsContainer);
                
                // Make entire card clickable for viewing details
                card.onclick = () => {
                    viewProductDetails(product.id);
                };
                
                grid.appendChild(card);
            });
        }

        // Show specific image in carousel
        function showImage(carousel, index) {
            const images = carousel.querySelectorAll('img');
            const dots = carousel.querySelectorAll('.carousel-dot');
            
            images.forEach((img, i) => {
                img.classList.toggle('active', i === index);
            });
            
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });
        }

        // Render filters
        function renderFilters() {
            const filterButtons = document.getElementById('filterButtons');
            filterButtons.innerHTML = '';
            
            // All products filter
            const allFilter = document.createElement('button');
            allFilter.className = 'filter-btn active';
            allFilter.textContent = 'All';
            allFilter.onclick = () => {
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                allFilter.classList.add('active');
                closePriceFilter();
                filteredProducts = [...allProducts];
                renderProducts(filteredProducts);
                document.getElementById('searchBox').value = '';
            };
            filterButtons.appendChild(allFilter);
            
            // Get unique categories
            const categories = [...new Set(allProducts
                .map(p => p.category)
                .filter(Boolean)
                .sort())];
            
            categories.forEach(category => {
                const filter = document.createElement('button');
                filter.className = 'filter-btn';
                filter.textContent = category.length > 12 ? category.substring(0, 12) + '...' : category;
                filter.title = category;
                filter.onclick = () => {
                    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                    filter.classList.add('active');
                    closePriceFilter();
                    filteredProducts = allProducts.filter(p => p.category === category);
                    renderProducts(filteredProducts);
                };
                filterButtons.appendChild(filter);
            });
        }

        // Price filter toggle
        document.getElementById('priceFilterBtn').addEventListener('click', () => {
            const panel = document.getElementById('priceFilterPanel');
            isPriceFilterOpen = !isPriceFilterOpen;
            
            if (isPriceFilterOpen) {
                panel.classList.add('active');
                document.getElementById('priceFilterBtn').style.borderColor = 'var(--primary)';
                document.getElementById('priceFilterBtn').style.color = 'var(--primary)';
            } else {
                panel.classList.remove('active');
                document.getElementById('priceFilterBtn').style.borderColor = '';
                document.getElementById('priceFilterBtn').style.color = '';
            }
        });

        function closePriceFilter() {
            const panel = document.getElementById('priceFilterPanel');
            panel.classList.remove('active');
            isPriceFilterOpen = false;
            document.getElementById('priceFilterBtn').style.borderColor = '';
            document.getElementById('priceFilterBtn').style.color = '';
        }

        // Apply price filter
        function applyPriceFilter() {
            const minPrice = parseFloat(document.getElementById('minPrice').value) || 0;
            const maxPrice = parseFloat(document.getElementById('maxPrice').value) || Infinity;
            
            filteredProducts = allProducts.filter(product => {
                if (product.price === 'NA' || !product.price) return false;
                const price = parseFloat(product.price);
                return price >= minPrice && price <= maxPrice;
            });
            
            renderProducts(filteredProducts);
            closePriceFilter();
        }

        // Clear price filter
        function clearPriceFilter() {
            document.getElementById('minPrice').value = '';
            document.getElementById('maxPrice').value = '';
            filteredProducts = [...allProducts];
            renderProducts(filteredProducts);
            closePriceFilter();
        }

        // View product details
        function viewProductDetails(productId) {
            window.location.href = `product.html?id=${productId}`;
        }

        // WhatsApp redirect
        function redirectWA(product) {
            let message = `Hi Era Solar,%0A%0A`;
            message += `I'm interested in: *${encodeURIComponent(product.title)}*%0A`;
            
            if (product.product_code) {
                message += `Code: ${encodeURIComponent(product.product_code)}%0A`;
            }
            
            if (product.price && product.price !== 'NA') {
                message += `Price: ₹${encodeURIComponent(product.price)}%0A`;
            }
            
            if (product.companies && product.companies.length > 0) {
                const companyNames = product.companies.map(c => c.company_name).join(', ');
                message += `Brand: ${encodeURIComponent(companyNames)}%0A`;
            }
            
            message += `%0APlease provide more details.`;
            
            const whatsappUrl = `https://wa.me/919511864107?text=${message}`;
            window.open(whatsappUrl, '_blank');
        }

        // Search functionality
        function setupSearch() {
            const searchBox = document.getElementById('searchBox');
            
            searchBox.addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase().trim();
                
                if (searchTerm === '') {
                    filteredProducts = [...allProducts];
                    renderProducts(filteredProducts);
                    return;
                }
                
                filteredProducts = allProducts.filter(product => 
                    product.title.toLowerCase().includes(searchTerm) ||
                    (product.description && product.description.toLowerCase().includes(searchTerm)) ||
                    (product.product_code && product.product_code.toLowerCase().includes(searchTerm)) ||
                    (product.category && product.category.toLowerCase().includes(searchTerm)) ||
                    (product.companies && product.companies.some(c => 
                        c.company_name.toLowerCase().includes(searchTerm)
                    ))
                );
                
                renderProducts(filteredProducts);
            });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadProducts();
            setupSearch();
        });
    </script>
</body>
</html>
