    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        :root {
            --primary: #FF9800;
            --secondary: #2196F3;
            --accent: #FF5722;
            --dark: #1A237E;
            --green: #4CAF50;
            --yellow: #FFC107;
            --dark-blue: #0D1B3E;
            --light: #F5F5F5;
            --success: #4CAF50;
            --light-blue: #E8F4FD;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --gradient: linear-gradient(135deg, #FF9800 0%, #FF5722 100%);
            --gradient-blue: linear-gradient(135deg, #1A237E 0%, #2196F3 100%);
        }

        body {
            background-color: #ffffff;
            color: #333;
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Header Styles - From Index */
        header {
            background: #ffffff;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-container img {
            height: 50px;
            transition: transform 0.3s ease;
        }

        .logo-container:hover img {
            transform: scale(1.05);
        }

        .logo-slogan {
            font-size: 13px;
            color: #666;
            font-weight: 500;
            letter-spacing: 0.5px;
            opacity: 0.8;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: #444;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s ease;
            position: relative;
            padding: 6px 0;
            white-space: nowrap;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 20px;
            color: #444;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .mobile-menu-btn:hover {
            transform: rotate(90deg);
        }

        /* Page Title */
        .page-title {
            text-align: center;
            padding: 30px 5% 20px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            margin-bottom: 20px;
        }

        .page-title h1 {
            font-size: 2.5rem;
            color: var(--dark);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .page-title p {
            font-size: 1.1rem;
            color: #666;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.7;
        }

        /* Search Container - Enhanced */
        .search-container {
            padding: 0 5% 20px;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
        }

        .search-box {
            width: 100%;
            max-width: 600px;
            padding: 16px 25px;
            border: 2px solid #e2e8f0;
            border-radius: 30px;
            font-size: 16px;
            background: white;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }

        .search-box:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 152, 0, 0.15);
        }

        /* Filter Bar - Enhanced */
        .filter-bar {
            padding: 0 5% 15px;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            background: white;
            border: 2px solid #e2e8f0;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            color: #4a5568;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }

        .filter-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: var(--gradient);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
        }

        /* Price Filter - Enhanced */
        .price-filter {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 15px 20px;
            border-radius: 12px;
            margin: 0 auto 20px;
            max-width: 1400px;
            box-shadow: var(--shadow);
            flex-wrap: wrap;
            justify-content: center;
            border: 1px solid #eee;
        }

        .price-filter span {
            font-weight: 600;
            color: var(--dark);
        }

        .price-filter input {
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            width: 140px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .price-filter input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 152, 0, 0.1);
        }

        .price-filter button {
            background: var(--gradient);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.2);
        }

        .price-filter button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 152, 0, 0.3);
        }

        .price-filter button.clear {
            background: #e2e8f0;
            color: #4a5568;
        }

        .price-filter button.clear:hover {
            background: #d1d9e6;
        }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding: 20px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Product Card - Enhanced with Index Theme */
        .card {
            background: white;
            border: none;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
            border: 1px solid #eee;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            border-color: var(--primary);
        }

        /* Carousel */
        .carousel {
            position: relative;
            width: 100%;
            overflow: hidden;
            height: 220px;
            background: linear-gradient(135deg, rgba(255, 152, 0, 0.1) 0%, rgba(33, 150, 243, 0.1) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .carousel img.active {
            opacity: 1;
        }

        /* Carousel Navigation Dots */
        .carousel-dots {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 6px;
            z-index: 2;
        }

        .carousel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .carousel-dot.active {
            background: var(--primary);
            transform: scale(1.2);
        }

        /* Card Info */
        .info {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--dark);
            line-height: 1.4;
        }

        .price {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .description {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Company Logos */
        .logos {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            align-items: center;
        }

        .logos img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            border-radius: 8px;
            border: 2px solid #e2e8f0;
            padding: 2px;
            background: white;
            transition: all 0.3s ease;
        }

        .logos img:hover {
            transform: scale(1.1);
            border-color: var(--primary);
        }

        /* Order Button - Enhanced */
        .btn {
            margin: 0 20px 20px;
            background: var(--gradient);
            color: white;
            padding: 16px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            border: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 152, 0, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn i {
            font-size: 18px;
        }

        /* View Details Button - Enhanced */
        .view-details-btn {
            margin: 0 20px 15px;
            background: #f8f9fa;
            color: #4a5568;
            padding: 14px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            border: 2px solid #e2e8f0;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .view-details-btn:hover {
            background: #e9ecef;
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
        }

        /* Button Container */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #a0aec0;
            grid-column: 1 / -1;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state, .no-products {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #a0aec0;
        }

        .empty-state i, .no-products i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
            color: var(--primary);
        }

        .no-products h3, .empty-state h3 {
            color: var(--dark);
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        /* Product Code Badge */
        .product-code {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            z-index: 2;
            backdrop-filter: blur(5px);
        }

        /* Category Badge */
        .category-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--gradient);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            z-index: 2;
            backdrop-filter: blur(5px);
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .nav-links {
                position: fixed;
                top: 70px;
                left: 0;
                width: 100%;
                background-color: white;
                flex-direction: column;
                align-items: center;
                padding: 20px 0;
                box-shadow: 0 10px 20px rgba(0,0,0,0.1);
                transform: translateY(-100%);
                opacity: 0;
                visibility: hidden;
                transition: all 0.3s ease;
                z-index: 999;
                border-top: 1px solid #eee;
                gap: 15px;
            }
            
            .nav-links.active {
                transform: translateY(0);
                opacity: 1;
                visibility: visible;
            }
            
            .mobile-menu-btn {
                display: block;
            }
            
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                padding: 16px;
                gap: 16px;
            }
            
            .page-title h1 {
                font-size: 2rem;
            }
            
            .carousel {
                height: 200px;
            }
            
            .btn, .view-details-btn {
                padding: 14px;
                font-size: 15px;
            }
        }

        @media (max-width: 480px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 12px;
                padding: 12px;
            }
            
            .page-title {
                padding: 20px 5% 15px;
            }
            
            .page-title h1 {
                font-size: 1.8rem;
            }
            
            .page-title p {
                font-size: 1rem;
            }
            
            .carousel {
                height: 180px;
            }
            
            .info {
                padding: 15px;
            }
            
            .title {
                font-size: 14px;
            }
            
            .price {
                font-size: 18px;
            }
            
            .btn, .view-details-btn {
                margin: 0 15px 15px;
                padding: 12px;
                font-size: 14px;
            }
            
            .logos img {
                width: 28px;
                height: 28px;
            }
            
            .search-box {
                padding: 14px 20px;
                font-size: 14px;
            }
            
            .filter-btn {
                padding: 8px 16px;
                font-size: 13px;
            }
            
            .price-filter input {
                width: 110px;
                padding: 10px 12px;
            }
        }

        /* WhatsApp Button - From Index */
        .whatsapp-button {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 50px;
            height: 50px;
            background: #25D366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);

        .whatsapp-button:hover {
            transform: scale(1.1);

            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
            animation: none;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Supabase client
        const sb = supabase.createClient(
            "https://mnkewhamntefyutzrnaw.supabase.co",
            "sb_publishable_8wi_FUAoAhhnHRNsJg3u8w_bbPLiGHd"
        );

        let allProducts = [];
        let allCompanies = [];
        let carouselIntervals = new Map();

        // Mobile menu toggle - From Index
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const navLinks = document.getElementById('navLinks');
        
        mobileMenuBtn.addEventListener('click', () => {
            navLinks.classList.toggle('active');
            mobileMenuBtn.innerHTML = navLinks.classList.contains('active') 
                ? '<i class="fas fa-times"></i>' 
                : '<i class="fas fa-bars"></i>';
        });
        
        // Close menu when clicking a link
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('active');
                mobileMenuBtn.innerHTML = '<i class="fas fa-bars"></i>';
            });
        });

        // Generate slug
        function generateSlug(title, code = '') {
            const baseSlug = title.toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-|-$/g, '');
            
            if (code) {
                return `${baseSlug}-${code}`;
            }
            return baseSlug;
        }

        // Load all products
        async function loadProducts() {
            try {
                document.getElementById('loadingState').style.display = 'block';
                
                // Load companies first
                const { data: companies, error: companiesError } = await sb
                    .from('companies')
                    .select('*');
                    
                if (companiesError) throw companiesError;
                allCompanies = companies || [];
                
                // Load products with their companies
                const { data: products, error: productsError } = await sb
                    .from('products')
                    .select(`
                        *,
                        product_companies (
                            company_id,
                            companies (
                                id,
                                company_name,
                                logo_image_id
                            )
                        )
                    `)
                    .order('created_at', { ascending: false });
                    
                if (productsError) throw productsError;
                
                // Process products data
                allProducts = (products || []).map(product => {
                    // Get associated companies
                    const companies = (product.product_companies || [])
                        .map(pc => pc.companies)
                        .filter(Boolean);
                    
                    return {
                        ...product,
                        companies: companies,
                        slug: generateSlug(product.title, product.product_code || product.id),
                        // Ensure images_id is an array
                        images_id: Array.isArray(product.images_id) ? product.images_id : []
                    };
                });
                
                renderProducts(allProducts);
                renderFilters();
                document.getElementById('loadingState').style.display = 'none';
                
                // Set SEO for first product
                if (allProducts.length > 0) {
                    setSEOMeta(allProducts[0]);
                }
                
            } catch (error) {
                console.error('Error loading products:', error);
                document.getElementById('loadingState').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Error Loading Products</h3>
                        <p>Please check your connection and try again.</p>
                    </div>
                `;
            }
        }

        // Render products
        function renderProducts(products) {
            const grid = document.getElementById('grid');
            
            // Clear existing carousel intervals
            carouselIntervals.forEach(interval => clearInterval(interval));
            carouselIntervals.clear();
            
            if (products.length === 0) {
                grid.innerHTML = `
                    <div class="no-products">
                        <i class="fas fa-search"></i>
                        <h3>No Products Found</h3>
                        <p>Try adjusting your search or filter criteria</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = '';
            
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'card';
                
                // Product code badge
                if (product.product_code) {
                    const codeBadge = document.createElement('div');
                    codeBadge.className = 'product-code';
                    codeBadge.innerHTML = `<i class="fas fa-tag"></i> ${product.product_code}`;
                    card.appendChild(codeBadge);
                }
                
                // Category badge (if available)
                if (product.category) {
                    const categoryBadge = document.createElement('div');
                    categoryBadge.className = 'category-badge';
                    categoryBadge.textContent = product.category;
                    card.appendChild(categoryBadge);
                }
                
                // Carousel
                const carousel = document.createElement('div');
                carousel.className = 'carousel';
                
                const images = product.images_id || [];
                
                if (images.length > 0) {
                    images.forEach((imageUrl, index) => {
                        const img = document.createElement('img');
                        img.src = imageUrl;
                        img.alt = product.title;
                        img.loading = 'lazy';
                        img.className = index === 0 ? 'active' : '';
                        img.onerror = () => {
                            console.error('Failed to load image:', imageUrl);
                            // Show placeholder for broken images
                            img.src = 'https://via.placeholder.com/300x200/FF9800/ffffff?text=Product+Image';
                        };
                        carousel.appendChild(img);
                    });
                    
                    // Add navigation dots if multiple images
                    if (images.length > 1) {
                        const dotsContainer = document.createElement('div');
                        dotsContainer.className = 'carousel-dots';
                        
                        images.forEach((_, index) => {
                            const dot = document.createElement('div');
                            dot.className = `carousel-dot ${index === 0 ? 'active' : ''}`;
                            dot.onclick = (e) => {
                                e.stopPropagation(); // Prevent card click when clicking dots
                                showImage(carousel, index);
                            };
                            dotsContainer.appendChild(dot);
                        });
                        
                        carousel.appendChild(dotsContainer);
                        
                        // Auto-rotate carousel
                        let currentIndex = 0;
                        const interval = setInterval(() => {
                            currentIndex = (currentIndex + 1) % images.length;
                            showImage(carousel, currentIndex);
                        }, 4000);
                        
                        carouselIntervals.set(card, interval);
                    }
                } else {
                    // No image placeholder
                    const placeholder = document.createElement('div');
                    placeholder.style.cssText = `
                        width: 100%;
                        height: 100%;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        background: linear-gradient(135deg, rgba(255, 152, 0, 0.1) 0%, rgba(33, 150, 243, 0.1) 100%);
                        color: var(--primary);
                        font-size: 48px;
                    `;
                    placeholder.innerHTML = '<i class="fas fa-image"></i>';
                    carousel.appendChild(placeholder);
                }
                
                card.appendChild(carousel);
                
                // Product Info
                const info = document.createElement('div');
                info.className = 'info';
                
                info.innerHTML = `
                    <div class="title">${product.title}</div>
                    ${product.price && product.price !== 'NA' ? `<div class="price">₹${product.price}</div>` : ''}
                    ${product.description ? `<div class="description">${product.description}</div>` : ''}
                `;
                
                // Company logos
                if (product.companies && product.companies.length > 0) {
                    const logosContainer = document.createElement('div');
                    logosContainer.className = 'logos';
                    
                    product.companies.forEach(company => {
                        if (company.logo_image_id) {
                            const img = document.createElement('img');
                            img.src = company.logo_image_id;
                            img.alt = company.company_name;
                            img.title = company.company_name;
                            img.onerror = () => {
                                img.style.display = 'none';
                            };
                            logosContainer.appendChild(img);
                        }
                    });
                    
                    if (logosContainer.children.length > 0) {
                        info.appendChild(logosContainer);
                    }
                }
                
                card.appendChild(info);
                
                // Button Container
                const btnContainer = document.createElement('div');
                btnContainer.className = 'btn-container';
                
                // View Details Button
                const viewDetailsBtn = document.createElement('button');
                viewDetailsBtn.className = 'view-details-btn';
                viewDetailsBtn.innerHTML = '<i class="fas fa-eye"></i> View Details';
                viewDetailsBtn.onclick = (e) => {
                    e.stopPropagation(); // Prevent card click
                    viewProductDetails(product.id);
                };
                
                // WhatsApp Order Button
                const whatsappBtn = document.createElement('button');
                whatsappBtn.className = 'btn';
                whatsappBtn.innerHTML = '<i class="fab fa-whatsapp"></i> Order on WhatsApp';
                whatsappBtn.onclick = (e) => {
                    e.stopPropagation(); // Prevent card click
                    redirectWA(product);
                };
                
                btnContainer.appendChild(viewDetailsBtn);
                btnContainer.appendChild(whatsappBtn);
                card.appendChild(btnContainer);
                
                // Make entire card clickable for viewing details
                card.onclick = () => {
                    viewProductDetails(product.id);
                };
                
                grid.appendChild(card);
            });
        }

        // Show specific image in carousel
        function showImage(carousel, index) {
            const images = carousel.querySelectorAll('img');
            const dots = carousel.querySelectorAll('.carousel-dot');
            
            images.forEach((img, i) => {
                img.classList.toggle('active', i === index);
            });
            
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });
        }

        // Render filters
        function renderFilters() {
            const filterBar = document.getElementById('filterBar');
            filterBar.innerHTML = '';
            
            // All products filter
            const allFilter = document.createElement('button');
            allFilter.className = 'filter-btn active';
            allFilter.textContent = 'All Products';
            allFilter.onclick = () => {
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                allFilter.classList.add('active');
                document.getElementById('priceFilter').style.display = 'none';
                renderProducts(allProducts);
                document.getElementById('searchBox').value = '';
            };
            filterBar.appendChild(allFilter);
            
            // Price filter toggle
            const priceFilterToggle = document.createElement('button');
            priceFilterToggle.className = 'filter-btn';
            priceFilterToggle.innerHTML = '<i class="fas fa-filter"></i> Price Filter';
            priceFilterToggle.onclick = () => {
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                priceFilterToggle.classList.add('active');
                const priceFilter = document.getElementById('priceFilter');
                priceFilter.style.display = priceFilter.style.display === 'none' ? 'flex' : 'none';
            };
            filterBar.appendChild(priceFilterToggle);
            
            // Get unique categories
            const categories = [...new Set(allProducts
                .map(p => p.category)
                .filter(Boolean))];
            
            categories.forEach(category => {
                const filter = document.createElement('button');
                filter.className = 'filter-btn';
                filter.textContent = category;
                filter.onclick = () => {
                    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                    filter.classList.add('active');
                    document.getElementById('priceFilter').style.display = 'none';
                    const filtered = allProducts.filter(p => p.category === category);
                    renderProducts(filtered);
                };
                filterBar.appendChild(filter);
            });
        }

        // Apply price filter
        function applyPriceFilter() {
            const minPrice = parseFloat(document.getElementById('minPrice').value) || 0;
            const maxPrice = parseFloat(document.getElementById('maxPrice').value) || Infinity;
            
            const filtered = allProducts.filter(product => {
                if (product.price === 'NA' || !product.price) return false;
                const price = parseFloat(product.price);
                return price >= minPrice && price <= maxPrice;
            });
            
            renderProducts(filtered);
        }

        // Clear price filter
        function clearPriceFilter() {
            document.getElementById('minPrice').value = '';
            document.getElementById('maxPrice').value = '';
            renderProducts(allProducts);
        }

        // View product details
        function viewProductDetails(productId) {
            window.location.href = `product.html?id=${productId}`;
        }

        // WhatsApp redirect
        function redirectWA(product) {
            let message = `Hi,%0A%0A`;
            message += `I'm interested in ordering: *${encodeURIComponent(product.title)}*%0A`;
            
            if (product.product_code) {
                message += `Product Code: ${encodeURIComponent(product.product_code)}%0A`;
            }
            
            if (product.price && product.price !== 'NA') {
                message += `Price: ₹${encodeURIComponent(product.price)}%0A`;
            }
            
            if (product.companies && product.companies.length > 0) {
                const companyNames = product.companies.map(c => c.company_name).join(', ');
                message += `Brand: ${encodeURIComponent(companyNames)}%0A`;
            }
            
            if (product.description) {
                const shortDesc = product.description.length > 100 
                    ? product.description.substring(0, 100) + '...' 
                    : product.description;
                message += `Description: ${encodeURIComponent(shortDesc)}%0A`;
            }
            
            message += `%0APlease let me know about availability and delivery options.`;
            
            const whatsappUrl = `https://wa.me/919511864107?text=${message}`;
            window.open(whatsappUrl, '_blank');
        }

        // SEO Meta + Schema
        function setSEOMeta(product) {
            const firstImage = product.images_id && product.images_id.length > 0 
                ? product.images_id[0] 
                : '';
            
            const slug = product.slug || 'product';
            const url = window.location.origin + '/product/' + slug;
            
            // Update canonical link
            let canonicalLink = document.querySelector("link[rel='canonical']");
            if (!canonicalLink) {
                canonicalLink = document.createElement('link');
                canonicalLink.rel = 'canonical';
                document.head.appendChild(canonicalLink);
            }
            canonicalLink.href = url;
            
            // Update Open Graph tags
            const ogTitle = document.querySelector('meta[property="og:title"]');
            const ogDescription = document.querySelector('meta[property="og:description"]');
            const ogImage = document.querySelector('meta[property="og:image"]');
            const ogUrl = document.querySelector('meta[property="og:url"]');
            
            if (ogTitle) ogTitle.content = product.title;
            if (ogDescription) ogDescription.content = product.description 
                ? product.description.substring(0, 150)
                : `Buy ${product.title} at competitive prices.`;
            if (ogImage) ogImage.content = firstImage;
            if (ogUrl) ogUrl.content = url;
            
            // Update Twitter tags
            const twitterTitle = document.querySelector('meta[name="twitter:title"]');
            const twitterDescription = document.querySelector('meta[name="twitter:description"]');
            const twitterImage = document.querySelector('meta[name="twitter:image"]');
            
            if (twitterTitle) twitterTitle.content = product.title;
            if (twitterDescription) twitterDescription.content = product.description 
                ? product.description.substring(0, 150)
                : `Buy ${product.title} at competitive prices.`;
            if (twitterImage) twitterImage.content = firstImage;
            
            // Update page title
            document.title = `${product.title} | Premium Products Collection`;
            
            // JSON-LD Schema
            const schema = {
                "@context": "https://schema.org/",
                "@type": "Product",
                "name": product.title,
                "description": product.description || `Premium quality ${product.title}`,
                "sku": product.product_code || product.id.toString(),
                "image": product.images_id || [],
                "brand": product.companies && product.companies.length > 0 ? {
                    "@type": "Brand",
                    "name": product.companies.map(c => c.company_name).join(", ")
                } : undefined,
                "offers": {
                    "@type": "Offer",
                    "priceCurrency": "INR",
                    "price": product.price && product.price !== 'NA' ? parseFloat(product.price) : undefined,
                    "priceValidUntil": new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
                    "url": url,
                    "availability": "https://schema.org/InStock",
                    "seller": {
                        "@type": "Organization",
                        "name": "Premium Shop"
                    }
                }
            };
            
            document.getElementById('productSchema').textContent = JSON.stringify(schema, null, 2);
        }

        // Search functionality
        function setupSearch() {
            const searchBox = document.getElementById('searchBox');
            
            searchBox.addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase().trim();
                
                if (searchTerm === '') {
                    renderProducts(allProducts);
                    return;
                }
                
                const filtered = allProducts.filter(product => 
                    product.title.toLowerCase().includes(searchTerm) ||
                    (product.description && product.description.toLowerCase().includes(searchTerm)) ||
                    (product.product_code && product.product_code.toLowerCase().includes(searchTerm)) ||
                    (product.category && product.category.toLowerCase().includes(searchTerm)) ||
                    (product.companies && product.companies.some(c => 
                        c.company_name.toLowerCase().includes(searchTerm)
                    ))
                );
                
                renderProducts(filtered);
            });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadProducts();
            setupSearch();
        });
    </script>
</body>
</html>
