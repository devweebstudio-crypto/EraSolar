<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Era Solar</title>
    <meta name="description" content="View detailed information about Era Solar's premium solar products">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="https://i.ibb.co/Xr2NHYPY/Gemini-Generated-Image-xeafzlxeafzlxeaf.jpg">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        :root {
            --primary: #FF9800;
            --secondary: #2196F3;
            --dark: #1A237E;
            --dark-blue: #0D1B3E;
            --light: #F5F5F5;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --gradient: linear-gradient(135deg, #FF9800 0%, #FF5722 100%);
            --gradient-blue: linear-gradient(135deg, #1A237E 0%, #2196F3 100%);
        }

        body {
            background-color: #ffffff;
            color: #333;
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Header */
        .header {
            background: #ffffff;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 15px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 16px;
            color: var(--dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .back-btn:hover {
            background: rgba(255, 152, 0, 0.1);
            color: var(--primary);
            transform: translateX(-3px);
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--dark);
            text-align: center;
            flex: 1;
        }

        /* Breadcrumb */
        .breadcrumb {
            padding: 15px 5%;
            background: #f8f9fa;
            font-size: 0.9rem;
            color: #666;
            border-bottom: 1px solid #eee;
        }

        .breadcrumb a {
            color: var(--primary);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .breadcrumb a:hover {
            color: var(--dark);
            text-decoration: underline;
        }

        .breadcrumb span {
            margin: 0 8px;
            color: #999;
        }

        /* Main Container */
        .product-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Loading State */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Product Details Layout */
        .product-details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 40px;
        }

        @media (max-width: 992px) {
            .product-details-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }
        }

        /* Image Gallery */
        .image-gallery {
            position: relative;
        }

        .main-image-container {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 400px;
        }

        .main-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            padding: 20px;
            cursor: zoom-in;
            transition: transform 0.3s ease;
        }

        .main-image:hover {
            transform: scale(1.02);
        }

        .thumbnail-container {
            display: flex;
            gap: 10px;
            padding: 10px;
            overflow-x: auto;
        }

        .thumbnail {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9fa;
            padding: 5px;
        }

        .thumbnail:hover,
        .thumbnail.active {
            border-color: var(--primary);
            transform: scale(1.05);
        }

        /* Product Info */
        .product-info {
            padding: 20px;
        }

        .product-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .product-price {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 20px;
            display: flex;
            align-items: baseline;
        }

        .product-price::before {
            content: '₹';
            font-size: 1.2rem;
            margin-right: 4px;
        }

        .product-price.na {
            color: #666;
            font-size: 1.4rem;
        }

        .product-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 152, 0, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--dark);
            font-weight: 500;
        }

        .meta-item i {
            color: var(--primary);
        }

        /* Sections */
        .section {
            margin: 30px 0;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--primary);
        }

        .product-description {
            font-size: 1rem;
            line-height: 1.7;
            color: #555;
            white-space: pre-line;
        }

        /* Specifications Grid */
        .specs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .spec-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            transition: all 0.3s ease;
        }

        .spec-item:hover {
            background: white;
            box-shadow: var(--shadow);
            transform: translateY(-2px);
        }

        .spec-label {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .spec-value {
            color: #555;
            font-size: 0.95rem;
        }

        /* Companies Section */
        .company-logos {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
        }

        .company-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
            border-radius: 8px;
            border: 2px solid #e2e8f0;
            padding: 8px;
            background: white;
            transition: all 0.3s ease;
        }

        .company-logo:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        .action-btn {
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .whatsapp-btn {
            background: var(--gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
        }

        .whatsapp-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 152, 0, 0.4);
        }

        .call-btn {
            background: var(--gradient-blue);
            color: white;
            box-shadow: 0 4px 15px rgba(26, 35, 126, 0.3);
        }

        .call-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(26, 35, 126, 0.4);
        }

        /* Share Section */
        .share-section {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #eee;
        }

        .share-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .share-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .share-btn:hover {
            transform: translateY(-3px) scale(1.1);
        }

        .share-facebook { background: #3b5998; }
        .share-twitter { background: #1da1f2; }
        .share-whatsapp { background: #25d366; }
        .share-email { background: var(--primary); }

        /* Suggestions Section */
        .suggestions-section {
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .view-all {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .view-all:hover {
            color: var(--dark);
            gap: 12px;
        }

        .suggestions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }

        .suggestion-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid #f0f0f0;
        }

        .suggestion-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
            border-color: var(--primary);
        }

        .suggestion-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .suggestion-card:hover .suggestion-image {
            transform: scale(1.05);
        }

        .suggestion-info {
            padding: 20px;
        }

        .suggestion-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 10px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .suggestion-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .suggestion-price::before {
            content: '₹';
            font-size: 0.9rem;
            margin-right: 2px;
        }

        .suggestion-btn {
            width: 100%;
            padding: 10px;
            background: var(--dark-blue);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .suggestion-btn:hover {
            background: #152452;
            transform: translateY(-2px);
        }

        /* Error State */
        .error-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 12px;
            margin: 40px auto;
            max-width: 500px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.5s ease;
        }

        .error-state i {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 20px;
            opacity: 0.7;
        }

        .error-state h2 {
            color: var(--dark);
            margin-bottom: 15px;
        }

        .error-state p {
            color: #666;
            margin-bottom: 25px;
        }

        .retry-btn {
            background: var(--gradient);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
        }

        /* Image Modal */
        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 28px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }

        /* Floating WhatsApp */
        .floating-whatsapp {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 50px;
            height: 50px;
            background: #25D366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s ease;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .floating-whatsapp:hover {
            transform: scale(1.1);
            background: #1da851;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
            animation: none;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .product-container {
                padding: 15px;
            }
            
            .header {
                padding: 12px 15px;
            }
            
            .header-title {
                font-size: 16px;
            }
            
            .breadcrumb {
                padding: 12px 15px;
                font-size: 0.85rem;
            }
            
            .main-image-container {
                height: 300px;
            }
            
            .product-title {
                font-size: 1.5rem;
            }
            
            .product-price {
                font-size: 1.6rem;
            }
            
            .action-buttons {
                gap: 10px;
            }
            
            .action-btn {
                padding: 14px;
                font-size: 0.95rem;
            }
            
            .suggestions-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 15px;
            }
        }

        @media (max-width: 576px) {
            .product-details-grid {
                gap: 20px;
            }
            
            .main-image-container {
                height: 250px;
            }
            
            .thumbnail {
                width: 60px;
                height: 60px;
            }
            
            .specs-grid {
                grid-template-columns: 1fr;
            }
            
            .product-meta {
                gap: 8px;
            }
            
            .meta-item {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
            
            .section-title {
                font-size: 1.1rem;
            }
            
            .product-description {
                font-size: 0.95rem;
            }
            
            .floating-whatsapp {
                bottom: 20px;
                right: 20px;
                width: 45px;
                height: 45px;
                font-size: 20px;
            }
        }

        @media (max-width: 480px) {
            .suggestions-grid {
                grid-template-columns: 1fr;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .share-buttons {
                justify-content: center;
            }
            
            .company-logos {
                justify-content: center;
            }
            
            .back-btn span {
                display: none;
            }
            
            .back-btn {
                padding: 8px;
            }
        }

        /* Animations */
        .product-details-grid > * {
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<!-- Header -->
<header class="header">
    <button class="back-btn" onclick="goBack()">
        <i class="fas fa-arrow-left"></i>
        <span>Back to Products</span>
    </button>
    
    <div class="header-title" id="pageTitle">Product Details</div>
</header>

<!-- Breadcrumb -->
<div class="breadcrumb">
    <a href="index.html">Home</a>
    <span>></span>
    <a href="products.html">Products</a>
    <span>></span>
    <span id="breadcrumbProduct">Product Details</span>
</div>

<!-- Main Container -->
<div class="product-container">
    
    <!-- Loading State -->
    <div class="loading-container" id="loadingState">
        <div class="loading-spinner"></div>
        <p>Loading product details...</p>
    </div>

    <!-- Product Details (Will be populated dynamically) -->
    <div id="productDetails" style="display: none;">
        
        <!-- Product Information -->
        <div class="product-details-grid">
            
            <!-- Image Gallery -->
            <div class="image-gallery">
                <div class="main-image-container">
                    <img id="mainImage" class="main-image" alt="Product Image" onclick="openImageModal(this.src)">
                </div>
                <div class="thumbnail-container" id="thumbnailContainer"></div>
            </div>
            
            <!-- Product Info -->
            <div class="product-info">
                <!-- Title & Price -->
                <h1 class="product-title" id="productTitle"></h1>
                <div class="product-price" id="productPrice"></div>
                
                <!-- Product Meta -->
                <div class="product-meta" id="productMeta"></div>
                
                <!-- Description -->
                <div class="section">
                    <h2 class="section-title">
                        <i class="fas fa-file-alt"></i>
                        Product Description
                    </h2>
                    <div class="product-description" id="productDescription"></div>
                </div>
                
                <!-- Specifications -->
                <div class="section" id="specificationsSection"></div>
                
                <!-- Companies -->
                <div class="section" id="companiesSection"></div>
                
                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button class="action-btn whatsapp-btn" onclick="orderOnWhatsApp()">
                        <i class="fab fa-whatsapp"></i>
                        <span>Inquire on WhatsApp</span>
                    </button>
                    <button class="action-btn call-btn" onclick="callForInquiry()">
                        <i class="fas fa-phone-alt"></i>
                        <span>Call for Details</span>
                    </button>
                </div>
                
                <!-- Share Section -->
                <div class="share-section">
                    <h3 class="section-title">
                        <i class="fas fa-share-alt"></i>
                        Share this Product
                    </h3>
                    <div class="share-buttons">
                        <div class="share-btn share-facebook" onclick="shareOnFacebook()">
                            <i class="fab fa-facebook-f"></i>
                        </div>
                        <div class="share-btn share-twitter" onclick="shareOnTwitter()">
                            <i class="fab fa-twitter"></i>
                        </div>
                        <div class="share-btn share-whatsapp" onclick="shareOnWhatsApp()">
                            <i class="fab fa-whatsapp"></i>
                        </div>
                        <div class="share-btn share-email" onclick="shareViaEmail()">
                            <i class="fas fa-envelope"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Product Suggestions -->
        <div class="suggestions-section" id="suggestionsSection">
            <div class="section-header">
                <h2 class="section-title">
                    <i class="fas fa-sun"></i>
                    Related Solar Products
                </h2>
                <a href="products.html" class="view-all">
                    View All Products
                    <i class="fas fa-arrow-right"></i>
                </a>
            </div>
            <div class="suggestions-grid" id="suggestionsGrid"></div>
        </div>
    </div>
    
    <!-- Error State -->
    <div class="error-state" id="errorState" style="display: none;">
        <i class="fas fa-exclamation-triangle"></i>
        <h2>Product Not Found</h2>
        <p>The product you're looking for doesn't exist or has been removed.</p>
        <button class="retry-btn" onclick="retryLoading()">
            <i class="fas fa-redo"></i>
            Try Again
        </button>
    </div>
</div>

<!-- Image Zoom Modal -->
<div class="image-modal" id="imageModal">
    <div class="modal-close" onclick="closeImageModal()">
        <i class="fas fa-times"></i>
    </div>
    <img class="modal-content" id="modalImage" alt="Enlarged Product Image">
</div>

<!-- Floating WhatsApp Button -->
<div class="floating-whatsapp" onclick="orderOnWhatsApp()">
    <i class="fab fa-whatsapp"></i>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// Supabase Client
const sb = supabase.createClient(
    "https://mnkewhamntefyutzrnaw.supabase.co",
    "sb_publishable_8wi_FUAoAhhnHRNsJg3u8w_bbPLiGHd"
);

let currentProduct = null;
let allProducts = [];

// Get product ID from URL
function getProductIdFromURL() {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get('id');
}

// Format price
function formatPrice(price) {
    if (!price || price === 'NA') {
        return '<span class="product-price na">Price on Request</span>';
    }
    return `₹${parseFloat(price).toLocaleString('en-IN')}`;
}

// Load product details
async function loadProductDetails() {
    const productId = getProductIdFromURL();
    
    if (!productId) {
        showErrorState();
        return;
    }
    
    try {
        // Fetch product with companies
        const { data: product, error } = await sb
            .from('products')
            .select(`
                *,
                product_companies (
                    company_id,
                    companies (
                        id,
                        company_name,
                        logo_image_id
                    )
                )
            `)
            .eq('id', productId)
            .single();
            
        if (error) throw error;
        
        if (!product) {
            showErrorState();
            return;
        }
        
        currentProduct = product;
        
        // Fetch all products for suggestions
        const { data: allProductsData } = await sb
            .from('products')
            .select('*')
            .neq('id', productId)
            .limit(8);
            
        allProducts = allProductsData || [];
        
        // Update page title
        document.title = `${product.title} - Era Solar`;
        document.getElementById('pageTitle').textContent = product.title;
        document.getElementById('breadcrumbProduct').textContent = product.title;
        
        // Render product details
        renderProductDetails();
        
        // Render suggestions
        renderSuggestions();
        
        // Set SEO meta
        setSEOMeta();
        
        // Hide loading, show content
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('productDetails').style.display = 'block';
        
    } catch (error) {
        console.error('Error loading product:', error);
        showErrorState();
    }
}

// Render product details
function renderProductDetails() {
    if (!currentProduct) return;
    
    const product = currentProduct;
    
    // Set title
    document.getElementById('productTitle').textContent = product.title;
    
    // Set price
    const priceElement = document.getElementById('productPrice');
    if (product.price && product.price !== 'NA') {
        priceElement.innerHTML = formatPrice(product.price);
        priceElement.className = 'product-price';
    } else {
        priceElement.innerHTML = '<span class="product-price na">Price on Request</span>';
    }
    
    // Set description
    const description = product.description || 'No detailed description available for this solar product.';
    document.getElementById('productDescription').textContent = description;
    
    // Set meta info
    const metaContainer = document.getElementById('productMeta');
    metaContainer.innerHTML = '';
    
    if (product.product_code) {
        const metaItem = document.createElement('div');
        metaItem.className = 'meta-item';
        metaItem.innerHTML = `
            <i class="fas fa-tag"></i>
            <span>Product Code: ${product.product_code}</span>
        `;
        metaContainer.appendChild(metaItem);
    }
    
    if (product.category) {
        const metaItem = document.createElement('div');
        metaItem.className = 'meta-item';
        metaItem.innerHTML = `
            <i class="fas fa-solar-panel"></i>
            <span>Category: ${product.category}</span>
        `;
        metaContainer.appendChild(metaItem);
    }
    
    // Set specifications
    const specsSection = document.getElementById('specificationsSection');
    specsSection.innerHTML = '';
    
    // Additional specifications from product data
    const additionalSpecs = {
        'Material': product.material,
        'Color': product.color,
        'Size': product.size,
        'Weight': product.weight,
        'Dimensions': product.dimensions,
        'Warranty': product.warranty,
        'Power Output': product.power_output,
        'Efficiency': product.efficiency,
        'Voltage': product.voltage,
        'Temperature Range': product.temperature_range
    };
    
    let hasSpecs = false;
    for (const [key, value] of Object.entries(additionalSpecs)) {
        if (value) {
            hasSpecs = true;
            break;
        }
    }
    
    if (hasSpecs) {
        specsSection.innerHTML = `
            <h2 class="section-title">
                <i class="fas fa-list-alt"></i>
                Product Specifications
            </h2>
            <div class="specs-grid" id="specsGrid"></div>
        `;
        
        const specsGrid = document.getElementById('specsGrid');
        
        for (const [key, value] of Object.entries(additionalSpecs)) {
            if (value) {
                const specItem = document.createElement('div');
                specItem.className = 'spec-item';
                specItem.innerHTML = `
                    <div class="spec-label">${key}</div>
                    <div class="spec-value">${value}</div>
                `;
                specsGrid.appendChild(specItem);
            }
        }
    }
    
    // Set companies
    const companiesSection = document.getElementById('companiesSection');
    companiesSection.innerHTML = '';
    
    const companies = (product.product_companies || [])
        .map(pc => pc.companies)
        .filter(Boolean);
    
    if (companies.length > 0) {
        companiesSection.innerHTML = `
            <h2 class="section-title">
                <i class="fas fa-industry"></i>
                Available Brands
            </h2>
            <div class="company-logos" id="companyLogos"></div>
        `;
        
        const companyLogos = document.getElementById('companyLogos');
        
        companies.forEach(company => {
            if (company.logo_image_id) {
                const logo = document.createElement('img');
                logo.className = 'company-logo';
                logo.src = company.logo_image_id;
                logo.alt = company.company_name;
                logo.title = company.company_name;
                logo.onerror = () => {
                    logo.src = 'https://via.placeholder.com/60x60/FF9800/ffffff?text=' + 
                              encodeURIComponent(company.company_name.charAt(0));
                };
                companyLogos.appendChild(logo);
            }
        });
    }
    
    // Set images
    const images = product.images_id || [];
    const mainImage = document.getElementById('mainImage');
    const thumbnailContainer = document.getElementById('thumbnailContainer');
    thumbnailContainer.innerHTML = '';
    
    if (images.length > 0) {
        mainImage.src = images[0];
        mainImage.style.display = 'block';
        
        images.forEach((imageUrl, index) => {
            const thumbnail = document.createElement('img');
            thumbnail.className = `thumbnail ${index === 0 ? 'active' : ''}`;
            thumbnail.src = imageUrl;
            thumbnail.alt = `Product Image ${index + 1}`;
            thumbnail.onclick = () => {
                mainImage.src = imageUrl;
                document.querySelectorAll('.thumbnail').forEach(t => t.classList.remove('active'));
                thumbnail.classList.add('active');
                mainImage.scrollIntoView({ behavior: 'smooth', block: 'center' });
            };
            thumbnail.onerror = () => {
                thumbnail.src = 'https://via.placeholder.com/80x80/FF9800/ffffff?text=Image';
            };
            thumbnailContainer.appendChild(thumbnail);
        });
    } else {
        mainImage.src = 'https://via.placeholder.com/500x400/FF9800/ffffff?text=Solar+Product';
        mainImage.style.display = 'block';
    }
}

// Render suggestions
function renderSuggestions() {
    const suggestionsGrid = document.getElementById('suggestionsGrid');
    suggestionsGrid.innerHTML = '';
    
    if (allProducts.length === 0) {
        document.getElementById('suggestionsSection').style.display = 'none';
        return;
    }
    
    allProducts.slice(0, 4).forEach(product => {
        const imageUrl = product.images_id && product.images_id.length > 0 
            ? product.images_id[0] 
            : 'https://via.placeholder.com/300x200/FF9800/ffffff?text=Solar+Product';
        
        const suggestionCard = document.createElement('div');
        suggestionCard.className = 'suggestion-card';
        suggestionCard.onclick = () => {
            window.location.href = `product.html?id=${product.id}`;
        };
        
        suggestionCard.innerHTML = `
            <img src="${imageUrl}" alt="${product.title}" class="suggestion-image" 
                 onerror="this.src='https://via.placeholder.com/300x200/FF9800/ffffff?text=Solar+Product'">
            <div class="suggestion-info">
                <h3 class="suggestion-title">${product.title}</h3>
                <div class="suggestion-price">${product.price && product.price !== 'NA' ? `₹${product.price}` : 'Price on Request'}</div>
                <button class="suggestion-btn" onclick="event.stopPropagation(); window.location.href='product.html?id=${product.id}'">
                    <i class="fas fa-eye"></i> View Details
                </button>
            </div>
        `;
        
        suggestionsGrid.appendChild(suggestionCard);
    });
}

// Set SEO meta
function setSEOMeta() {
    if (!currentProduct) return;
    
    const product = currentProduct;
    const firstImage = product.images_id && product.images_id.length > 0 
        ? product.images_id[0] 
        : '';
    
    const url = window.location.href;
    
    // JSON-LD Schema
    const schema = {
        "@context": "https://schema.org/",
        "@type": "Product",
        "name": product.title,
        "description": product.description || `Premium solar energy product from Era Solar`,
        "image": product.images_id || [],
        "sku": product.product_code || product.id.toString(),
        "brand": {
            "@type": "Brand",
            "name": "Era Solar"
        },
        "offers": {
            "@type": "Offer",
            "url": url,
            "priceCurrency": "INR",
            "price": product.price && product.price !== 'NA' ? parseFloat(product.price) : undefined,
            "availability": "https://schema.org/InStock",
            "seller": {
                "@type": "Organization",
                "name": "Era Solar"
            }
        }
    };
    
    document.getElementById('productSchema').textContent = JSON.stringify(schema, null, 2);
}

// Show error state
function showErrorState() {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('errorState').style.display = 'block';
}

// Retry loading
function retryLoading() {
    document.getElementById('errorState').style.display = 'none';
    document.getElementById('loadingState').style.display = 'flex';
    loadProductDetails();
}

// Go back
function goBack() {
    window.history.back();
}

// Image modal functions
function openImageModal(src) {
    const modal = document.getElementById('imageModal');
    const modalImage = document.getElementById('modalImage');
    modalImage.src = src;
    modal.style.display = 'flex';
    document.body.style.overflow = 'hidden';
}

function closeImageModal() {
    const modal = document.getElementById('imageModal');
    modal.style.display = 'none';
    document.body.style.overflow = 'auto';
}

// Share functions
function shareOnFacebook() {
    const url = encodeURIComponent(window.location.href);
    window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank');
}

function shareOnTwitter() {
    const url = encodeURIComponent(window.location.href);
    const text = encodeURIComponent(currentProduct?.title || 'Check out this solar product from Era Solar!');
    window.open(`https://twitter.com/intent/tweet?url=${url}&text=${text}`, '_blank');
}

function shareOnWhatsApp() {
    const url = encodeURIComponent(window.location.href);
    const text = encodeURIComponent(`Check out ${currentProduct?.title || 'this solar product'} from Era Solar!`);
    window.open(`https://wa.me/?text=${text}%0A${url}`, '_blank');
}

function shareViaEmail() {
    const subject = encodeURIComponent(currentProduct?.title || 'Solar Product Details - Era Solar');
    const body = encodeURIComponent(`Check out this solar product from Era Solar: ${window.location.href}`);
    window.location.href = `mailto:?subject=${subject}&body=${body}`;
}

// Order functions
function orderOnWhatsApp() {
    if (!currentProduct) return;
    
    let message = `Hi Era Solar,%0A%0A`;
    message += `I'm interested in your solar product: *${encodeURIComponent(currentProduct.title)}*%0A`;
    
    if (currentProduct.product_code) {
        message += `Product Code: ${encodeURIComponent(currentProduct.product_code)}%0A`;
    }
    
    if (currentProduct.price && currentProduct.price !== 'NA') {
        message += `Price: ₹${encodeURIComponent(currentProduct.price)}%0A`;
    }
    
    if (currentProduct.description) {
        const shortDesc = currentProduct.description.length > 100 
            ? currentProduct.description.substring(0, 100) + '...' 
            : currentProduct.description;
        message += `Description: ${encodeURIComponent(shortDesc)}%0A`;
    }
    
    message += `%0APlease provide more details about installation, warranty, and delivery.`;
    
    window.open(`https://wa.me/919511864107?text=${message}`, '_blank');
}

function callForInquiry() {
    window.location.href = 'tel:+919511864107';
}

// Initialize when page loads
document.addEventListener('DOMContentLoaded', () => {
    loadProductDetails();
    
    // Close modal on escape key
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            closeImageModal();
        }
    });
    
    // Close modal when clicking outside image
    document.getElementById('imageModal').addEventListener('click', (e) => {
        if (e.target.id === 'imageModal') {
            closeImageModal();
        }
    });
});
